function domainCard(d){let gap=d.target-d.score,cls=d.score>=80?'good':d.score>=70?'warn':'bad';return `<article class="domain-card" style="--c:${d.c}" onclick="go('${d.id}')"><div class="domain-top"><span class="domain-icon">${d.icon}</span><span class="domain-no">المحور ${String(d.n).padStart(2,'0')}</span></div><h3>${d.name}</h3><p>${d.desc}</p><div class="domain-meta"><span>مستوى الاكتمال</span><b>${d.score}%</b></div><div class="progress" style="--c:${d.c}"><i style="width:${d.score}%"></i></div><div class="domain-foot"><span class="chip ${cls}">${d.issues} فجوات</span><span class="muted">الفجوة ${gap}% ←</span></div></article>`}
function issuesCenter(filterDomain='all'){const rows=issues.filter(x=>(filterDomain==='all'||x.d===filterDomain));return `<div class="welcome"><div><div class="eyebrow">مركز المعالجة الموحد</div><h2>كل فجوة تقابلها توصية قابلة للتنفيذ</h2><p>رتّب الأولويات حسب الأثر، ثم تابع المعالجة حتى اكتمال المحاور الأحد عشر.</p></div><div class="welcome-score"><div class="ring" style="--p:${Math.round(issues.filter(x=>x.status==='مغلقة').length/Math.max(issues.length,1)*100)}" data-value="${issues.filter(x=>x.status==='مغلقة').length}/${issues.length}"></div><div><small>المشكلات المغلقة</small><b>خطة التحسين</b></div></div></div><div class="grid kpis">${kpi('إجمالي المشكلات',issues.length,'في جميع المحاور','#6657e8','!',100)}${kpi('الحرجة',issues.filter(x=>x.sev==='حرج'&&x.status!=='مغلقة').length,'معالجة فورية','#ff6b62','◆',65)}${kpi('قيد المعالجة',issues.filter(x=>x.status==='قيد المعالجة').length,'تحت المتابعة','#f4ad32','↻',45)}${kpi('المغلقة',issues.filter(x=>x.status==='مغلقة').length,'تم التحقق منها','#16b89a','✓',issues.filter(x=>x.status==='مغلقة').length/issues.length*100)}</div><div class="card"><div class="toolbar"><div class="toolbar-group"><select class="select" id="domainFilter" onchange="renderIssueTable(this.value)"><option value="all">جميع المحاور</option>${domains.map(d=>`<option value="${d.id}" ${filterDomain===d.id?'selected':''}>${d.name}</option>`).join('')}</select><select class="select" id="severityFilter" onchange="applyIssueFilters()"><option value="all">كل مستويات الأثر</option><option>حرج</option><option>مرتفع</option><option>متوسط</option></select><input class="input" id="issueSearch" placeholder="بحث داخل المشكلات" oninput="applyIssueFilters()"></div><div class="toolbar-group"><button class="btn" onclick="exportIssues()">⇩ تصدير CSV</button><button class="btn primary" onclick="openIssueModal()">＋ تسجيل مشكلة</button></div></div><div id="issueTable">${issueTable(rows)}</div></div>`}
function issueTable(rows){if(!rows.length)return '<div class="empty">لا توجد مشكلات مطابقة للبحث.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>المشكلة</th><th>المحور</th><th>الأثر</th><th>السبب الجذري</th><th>مقترح التحسين</th><th>التحسن المتوقع</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody>${rows.map(x=>{const d=domains.find(z=>z.id===x.d),color=x.sev==='حرج'?'#ff6b62':x.sev==='مرتفع'?'#f4ad32':'#3c87ed';return `<tr><td><div class="issue-title">${x.title}</div><div class="issue-code">${x.id}</div></td><td><span class="chip info">${d.short}</span></td><td><span class="severity"><i style="background:${color}"></i>${x.sev}</span><div class="issue-code">${x.impact}</div></td><td>${x.cause}</td><td class="recommend">${x.rec}</td><td><b style="color:var(--mint)">+${x.gain}%</b></td><td><span class="chip ${x.status==='مغلقة'?'good':x.status==='قيد المعالجة'?'warn':'bad'}">${x.status}</span></td><td>${x.status==='مغلقة'?`<button class="btn" onclick="reopenIssue('${x.id}')">إعادة فتح</button>`:`<button class="btn mint" onclick="startFix('${x.id}')">${x.status==='قيد المعالجة'?'إغلاق':'بدء المعالجة'}</button>`}</td></tr>`}).join('')}</tbody></table></div>`}
function domainPage(d){const related=issues.filter(x=>x.d===d.id),gap=d.target-d.score;return `<div class="domain-hero"><div class="domain-summary" style="--c:${d.c}"><button class="back" onclick="go('overview')">→ العودة للرؤية الشاملة</button><h2>${d.icon} ${d.name}</h2><p>${d.desc}</p><div class="domain-score"><div class="score-big">${d.score}<small>%</small></div><div><b>مستوى الاكتمال الحالي</b><div style="font-size:10px;opacity:.75">المستهدف ${d.target}% · فجوة ${gap}%</div></div></div></div><div class="card"><div class="card-title"><div><h3>ملخص المحور</h3><p>ملكية ومؤشرات تشغيلية</p></div><button class="btn primary" onclick="openInitiative('${d.id}')">＋ مبادرة تحسين</button></div><div class="stat-list"><div class="stat-line"><span>الجهة المالكة</span><b>${d.owner}</b></div><div class="stat-line"><span>الأصول المسجلة</span><b>${d.assets.toLocaleString('ar')}</b></div><div class="stat-line"><span>الفجوات المفتوحة</span><b>${related.filter(x=>x.status!=='مغلقة').length}</b></div><div class="stat-line"><span>مبادرات التحسين</span><b>${initiatives.filter(x=>x.d===d.id).length}</b></div></div></div></div><div class="card" style="margin-bottom:15px"><div class="card-title"><div><h3>مقياس النضج</h3><p>الانتقال المنهجي نحو المستوى الخامس</p></div></div><div class="grid matrix">${[['1','أولي',20],['2','مُدار',40],['3','مُعرّف',60],['4','مقاس',80],['5','محسّن',100]].map(x=>`<div class="level ${d.score>=x[2]-19&&d.score<=x[2]?'active':''}"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div></div><div class="card"><div class="toolbar"><div class="card-title" style="margin:0"><div><h3>فجوات ${d.name}</h3><p>المشكلة والسبب ومقترح الاستكمال</p></div></div><div class="toolbar-group"><button class="btn" onclick="go('issues')">عرض المركز الموحد</button><button class="btn primary" onclick="openIssueModal('${d.id}')">＋ تسجيل فجوة</button></div></div>${issueTable(related)}</div>`}
function bindPage(id){}
function renderIssueTable(d){document.getElementById('issueTable').innerHTML=issueTable(issues.filter(x=>d==='all'||x.d===d))}
function applyIssueFilters(){const d=domainFilter.value,s=severityFilter.value,q=issueSearch.value.trim();document.getElementById('issueTable').innerHTML=issueTable(issues.filter(x=>(d==='all'||x.d===d)&&(s==='all'||x.sev===s)&&(!q||x.title.includes(q)||x.rec.includes(q)||x.cause.includes(q))))}
function startFix(id){const x=issues.find(i=>i.id===id);if(x.status==='قيد المعالجة'){x.status='مغلقة';const d=domains.find(z=>z.id===x.d);d.score=Math.min(d.target,d.score+x.gain);d.issues=Math.max(0,d.issues-1);toast('تم إغلاق المشكلة ورفع اكتمال المحور إلى '+d.score+'%','success')}else{x.status='قيد المعالجة';toast('بدأت المعالجة وتم ربط التوصية بخطة العمل','success')}refreshCurrent()}
function reopenIssue(id){const x=issues.find(i=>i.id===id);x.status='مفتوحة';toast('أعيد فتح المشكلة للمراجعة','info');refreshCurrent()}
function refreshCurrent(){go(current)}
function openIssueModal(domain=''){openModal('تسجيل مشكلة بيانات جديدة',`<div class="form-grid"><div class="field"><label>المحور</label><select id="fDomain">${domains.map(d=>`<option value="${d.id}" ${d.id===domain?'selected':''}>${d.name}</option>`).join('')}</select></div><div class="field"><label>مستوى الأثر</label><select id="fSev"><option>حرج</option><option>مرتفع</option><option>متوسط</option></select></div><div class="field full"><label>عنوان المشكلة</label><input id="fTitle" placeholder="صف المشكلة باختصار"></div><div class="field"><label>الأثر على البيانات</label><input id="fImpact" placeholder="مثال: تقارير غير دقيقة"></div><div class="field"><label>السبب الجذري</label><input id="fCause" placeholder="السبب المتوقع"></div><div class="field full"><label>مقترح التحسين</label><textarea id="fRec" rows="3" placeholder="الإجراء العملي المقترح"></textarea></div><div class="field"><label>التحسن المتوقع في الاكتمال</label><input id="fGain" type="number" min="1" max="30" value="5"></div></div><button class="btn primary" style="margin-top:16px" onclick="saveIssue()">حفظ المشكلة</button>`)}
function saveIssue(){const vals=[fTitle.value.trim(),fImpact.value.trim(),fCause.value.trim(),fRec.value.trim()];if(vals.some(x=>!x))return toast('يرجى تعبئة جميع الحقول المطلوبة','error');const prefix={governance:'DG',architecture:'AR',modeling:'DM',storage:'DO',security:'DS',integration:'DI',content:'DC',master:'MD',warehouse:'BI',metadata:'MM',quality:'DQ'}[fDomain.value];issues.unshift({id:prefix+'-'+String(Math.floor(Math.random()*900)+100),d:fDomain.value,title:vals[0],sev:fSev.value,status:'مفتوحة',impact:vals[1],cause:vals[2],rec:vals[3],gain:+fGain.value||5});const d=domains.find(x=>x.id===fDomain.value);d.issues++;closeModal();toast('تم تسجيل المشكلة وربطها بالمحور','success');go(current==='overview'?'issues':current)}
function openInitiative(domain){const d=domains.find(x=>x.id===domain);openModal('إضافة مبادرة تحسين',`<div class="form-grid"><div class="field full"><label>المحور</label><input value="${d.name}" disabled></div><div class="field full"><label>اسم المبادرة</label><input id="iName" placeholder="مثال: استكمال كتالوج الأصول"></div><div class="field"><label>المسؤول</label><input id="iOwner" placeholder="الفريق أو الشخص"></div><div class="field"><label>تاريخ الاستحقاق</label><input id="iDate" type="date"></div><div class="field full"><label>النتيجة المستهدفة</label><textarea id="iResult" rows="3"></textarea></div></div><button class="btn primary" style="margin-top:16px" onclick="saveInitiative('${domain}')">حفظ المبادرة</button>`)}
function saveInitiative(d){if(!iName.value.trim()||!iOwner.value.trim())return toast('أدخل اسم المبادرة والمسؤول','error');initiatives.push({d,name:iName.value,owner:iOwner.value,date:iDate.value,result:iResult.value});closeModal();toast('تمت إضافة مبادرة التحسين','success');go(d)}
function exportIssues(){const headers=['الرقم','المحور','المشكلة','الأثر','السبب','التوصية','الحالة'];const rows=issues.map(x=>[x.id,domains.find(d=>d.id===x.d).name,x.title,x.impact,x.cause,x.rec,x.status]);const csv='\uFEFF'+[headers,...rows].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='dama-data-issues.csv';a.click();URL.revokeObjectURL(a.href);toast('تم تصدير سجل المشكلات','success')}
function showNotifications(){openModal('التنبيهات',`<div class="feed"><div class="feed-item"><span class="feed-dot">!</span><div><b>3 مشكلات حرجة تحتاج إجراء</b><small>مركز فجوات البيانات · الآن</small></div></div><div class="feed-item"><span class="feed-dot">◎</span><div><b>اكتمل فحص جودة العملاء</b><small>جودة البيانات · منذ ساعة</small></div></div><div class="feed-item"><span class="feed-dot">♜</span><div><b>سياسة بانتظار الاعتماد</b><small>حوكمة البيانات · اليوم</small></div></div></div>`)}
function openHelp(){openModal('كيف تستخدم منصة نواة؟',`<div class="feed"><div class="feed-item"><span class="feed-dot">1</span><div><b>ابدأ من الرؤية الشاملة</b><small>قارن اكتمال المحاور الأحد عشر وحدد الأولويات.</small></div></div><div class="feed-item"><span class="feed-dot">2</span><div><b>افتح أي محور</b><small>راجع مستوى النضج والفجوات والجهة المالكة.</small></div></div><div class="feed-item"><span class="feed-dot">3</span><div><b>طبّق مقترح التحسين</b><small>ابدأ المعالجة ثم أغلق المشكلة لرفع اكتمال المحور.</small></div></div><div class="feed-item"><span class="feed-dot">4</span><div><b>صدّر سجل الفجوات</b><small>شارك ملف CSV مع فرق التنفيذ والمتابعة.</small></div></div></div>`)}
function openModal(t,b){modalTitle.textContent=t;modalBody.innerHTML=b;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}modal.onclick=e=>{if(e.target===modal)closeModal()}
function toast(msg,type='success'){const el=document.createElement('div');el.className='toast '+type;el.innerHTML=`<b>${type==='error'?'تعذر التنفيذ':type==='info'?'معلومة':'تم بنجاح'}</b><small>${msg}</small>`;toasts.appendChild(el);setTimeout(()=>el.remove(),3500)}

let connections=[{name:'مستودع التحليلات',type:'Snowflake',host:'analytics.company.local',status:'جاهز للتقييم'}],assessment=null,activeAssessmentTab='file';
const domainPageV3=domainPage;
domainPage=function(d){return domainWorkspace(d,'summary')};
function domainWorkspace(d,tab){const w=workspace[d.id],related=issues.filter(x=>x.d===d.id);return `<div class="domain-hero"><div class="domain-summary" style="--c:${d.c}"><button class="back" onclick="go('overview')">→ العودة للرؤية الشاملة</button><h2>${d.icon} ${d.name}</h2><p>${d.desc}</p><div class="domain-score"><div class="score-big">${d.score}<small>%</small></div><div><b>مستوى الاكتمال التشغيلي</b><div style="font-size:10px;opacity:.75">المستهدف ${d.target}% · ${w.records.length} سجلات · ${w.evidence.length} أدلة</div></div></div></div><div class="card"><div class="card-title"><div><h3>إدارة المحور</h3><p>المكونات التشغيلية المتكاملة</p></div><span class="integrated-badge">✓ مساحة عمل فعالة</span></div><div class="grid module-grid"><div class="module"><span class="module-icon">▦</span><b>السجلات والأصول</b><small>${w.records.length} عناصر</small></div><div class="module"><span class="module-icon">◫</span><b>السياسات والضوابط</b><small>${w.policies.length+w.controls.length} عناصر</small></div><div class="module"><span class="module-icon">◎</span><b>الأدلة والمؤشرات</b><small>${w.evidence.length} أدلة</small></div><div class="module"><span class="module-icon">!</span><b>المشكلات والمعالجة</b><small>${related.length} فجوات</small></div></div></div></div><div class="tabs"><button class="tab ${tab==='summary'?'active':''}" onclick="switchDomainTab('${d.id}','summary')">نظرة عامة</button><button class="tab ${tab==='records'?'active':''}" onclick="switchDomainTab('${d.id}','records')">السجلات والأصول</button><button class="tab ${tab==='controls'?'active':''}" onclick="switchDomainTab('${d.id}','controls')">السياسات والضوابط</button><button class="tab ${tab==='evidence'?'active':''}" onclick="switchDomainTab('${d.id}','evidence')">المؤشرات والأدلة</button><button class="tab ${tab==='problems'?'active':''}" onclick="switchDomainTab('${d.id}','problems')">المشكلات وخطة المعالجة</button></div><div id="domainTab">${domainTabContent(d,tab)}</div>`}
function switchDomainTab(id,tab){const d=domains.find(x=>x.id===id);content.innerHTML=domainWorkspace(d,tab)}
function simpleTable(headers,rows,kind,id){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}<th>الإجراء</th></tr></thead><tbody>${rows.map((r,i)=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}<td><button class="btn danger" onclick="deleteWorkspaceItem('${id}','${kind}',${i})">حذف</button></td></tr>`).join('')}</tbody></table></div>`}
function domainTabContent(d,tab){const w=workspace[d.id];if(tab==='records')return `<div class="card"><div class="toolbar"><div><h3 style="margin:0">سجل الأصول والعمليات</h3><span class="muted">إدارة العناصر الأساسية للمحور</span></div><button class="btn primary" onclick="openWorkspaceItem('${d.id}','records')">＋ إضافة سجل</button></div>${simpleTable(['الاسم','المالك','الحالة','آخر تحديث'],w.records,'records',d.id)}</div>`;if(tab==='controls')return `<div class="grid cols2"><div class="card"><div class="toolbar"><h3 style="margin:0">السياسات</h3><button class="btn primary" onclick="openWorkspaceItem('${d.id}','policies')">＋ سياسة</button></div>${simpleTable(['الرمز','السياسة','الحالة','المراجعة'],w.policies,'policies',d.id)}</div><div class="card"><div class="toolbar"><h3 style="margin:0">الضوابط</h3><button class="btn primary" onclick="openWorkspaceItem('${d.id}','controls')">＋ ضابط</button></div>${simpleTable(['الرمز','الضابط','الفاعلية','التكرار'],w.controls,'controls',d.id)}</div></div>`;if(tab==='evidence')return `<div class="card"><div class="toolbar"><div><h3 style="margin:0">الأدلة ومؤشرات الأداء</h3><span class="muted">الأدلة المستخدمة لإثبات تطبيق المحور</span></div><button class="btn primary" onclick="openWorkspaceItem('${d.id}','evidence')">＋ إضافة دليل</button></div>${simpleTable(['الرمز','الدليل','الحالة','التاريخ'],w.evidence,'evidence',d.id)}</div>`;if(tab==='problems')return `<div class="card"><div class="toolbar"><div><h3 style="margin:0">الفجوات وخطة الاستكمال</h3><span class="muted">كل مشكلة مرتبطة بتوصية وتحسن متوقع</span></div><button class="btn primary" onclick="openIssueModal('${d.id}')">＋ تسجيل مشكلة</button></div>${issueTable(issues.filter(x=>x.d===d.id))}</div>`;return `<div class="grid cols2"><div class="card"><div class="card-title"><div><h3>مقياس النضج</h3><p>مستوى التطبيق الحالي</p></div></div><div class="grid matrix">${[['1','أولي',20],['2','مُدار',40],['3','مُعرّف',60],['4','مقاس',80],['5','محسّن',100]].map(x=>`<div class="level ${d.score>=x[2]-19&&d.score<=x[2]?'active':''}"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div></div><div class="card"><div class="card-title"><div><h3>المساءلة والتنفيذ</h3><p>حالة مساحة العمل</p></div><button class="btn primary" onclick="openInitiative('${d.id}')">＋ مبادرة تحسين</button></div><div class="stat-list"><div class="stat-line"><span>الجهة المالكة</span><b>${d.owner}</b></div><div class="stat-line"><span>السياسات المعتمدة</span><b>${w.policies.length}</b></div><div class="stat-line"><span>الضوابط الفعالة</span><b>${w.controls.length}</b></div><div class="stat-line"><span>الأدلة الموثقة</span><b>${w.evidence.length}</b></div></div></div></div>`}
function openWorkspaceItem(id,kind){const names={records:'سجل أو أصل',policies:'سياسة',controls:'ضابط',evidence:'دليل'},labels={records:['الاسم','المالك','الحالة','آخر تحديث'],policies:['الرمز','اسم السياسة','الحالة','تاريخ المراجعة'],controls:['الرمز','اسم الضابط','الفاعلية','دورية الفحص'],evidence:['الرمز','اسم الدليل','الحالة','التاريخ']};stateWorkspace={id,kind};openModal('إضافة '+names[kind],`<div class="form-grid">${labels[kind].map((x,i)=>`<div class="field"><label>${x}</label><input id="ws${i}" ${i===3&&kind!=='controls'?'type="date"':''} placeholder="${x}"></div>`).join('')}</div><button class="btn primary" style="margin-top:15px" onclick="saveWorkspaceItem()">حفظ العنصر</button>`)}
let stateWorkspace=null;function saveWorkspaceItem(){const v=[0,1,2,3].map(i=>document.getElementById('ws'+i).value.trim());if(v.some(x=>!x))return toast('يرجى تعبئة جميع الحقول','error');workspace[stateWorkspace.id][stateWorkspace.kind].push(v);const {id,kind}=stateWorkspace;closeModal();toast('تم حفظ العنصر داخل مساحة العمل','success');switchDomainTab(id,kind==='records'?'records':kind==='evidence'?'evidence':'controls')}
function deleteWorkspaceItem(id,kind,i){workspace[id][kind].splice(i,1);toast('تم حذف العنصر','info');switchDomainTab(id,kind==='records'?'records':kind==='evidence'?'evidence':'controls')}
function assessmentPage(){return `<div class="welcome"><div><div class="eyebrow">DAMA DATA ASSESSMENT LAB</div><h2>حوّل بياناتك إلى تقرير تطبيق متكامل</h2><p>ارفع ملفاً أو عرّف اتصال قاعدة بيانات، ثم قيّم البيانات عبر محاور DAMA DMBOK الأحد عشر.</p></div><div class="welcome-score"><div class="ring" style="--p:${assessment?assessment.overall:0}" data-value="${assessment?assessment.overall+'%':'ابدأ'}"></div><div><small>آخر تقييم</small><b>${assessment?assessment.source:'لا يوجد تقييم'}</b></div></div></div><div class="tabs"><button class="tab ${activeAssessmentTab==='file'?'active':''}" onclick="switchAssessment('file')">⇧ رفع ملف</button><button class="tab ${activeAssessmentTab==='database'?'active':''}" onclick="switchAssessment('database')">⌁ ربط قاعدة بيانات</button><button class="tab ${activeAssessmentTab==='report'?'active':''}" onclick="switchAssessment('report')">▥ التقرير التفصيلي</button></div><div id="assessmentArea">${activeAssessmentTab==='file'?fileAssessment():activeAssessmentTab==='database'?databaseAssessment():assessmentReport()}</div>`}
function switchAssessment(tab){activeAssessmentTab=tab;document.getElementById('assessmentArea').innerHTML=tab==='file'?fileAssessment():tab==='database'?databaseAssessment():assessmentReport();document.querySelectorAll('.tabs .tab').forEach((b,i)=>b.classList.toggle('active',i===['file','database','report'].indexOf(tab)));if(tab==='file')bindDropzone()}
function fileAssessment(){return `<div class="grid cols2"><div class="card"><div class="card-title"><div><h3>رفع مصدر بيانات</h3><p>التحليل والتعديل الآمن يتمان محلياً داخل المتصفح</p></div></div><div class="dropzone" id="dropzone"><div class="upload-icon">⇧</div><b>اسحب ملفك هنا أو انقر للاختيار</b><small>XLSX · DOCX · CSV · JSON · XML · SQL · TXT</small></div><input id="dataFile" type="file" hidden accept=".csv,.json,.xml,.sql,.txt,.xlsx,.docx"><div class="analysis-steps"><span class="step"><i>1</i>قراءة البنية</span><span class="step-line"></span><span class="step"><i>2</i>فحص الجودة</span><span class="step-line"></span><span class="step"><i>3</i>مطابقة DMBOK</span></div><div id="fileStatus"></div></div><div class="card"><div class="card-title"><div><h3>ما الذي يتم تحليله؟</h3><p>أدلة تلقائية عبر المحاور الأحد عشر</p></div></div><div class="grid module-grid">${[['♜','الحوكمة','الملكية والتسمية'],['⌘','الهندسة','البنية والعلاقات'],['◇','النمذجة','الحقول والأنواع'],['▤','التخزين','الحجم والقابلية'],['⬡','الأمن','البيانات الحساسة'],['⇆','التكامل','المفاتيح والاتساق'],['▧','المحتوى','التنسيق والاحتفاظ'],['♢','الرئيسية','التكرار والمطابقة'],['▥','التحليلات','جاهزية القياس'],['≡','الوصفية','الأسماء والتعريفات'],['◎','الجودة','الاكتمال والصلاحية']].map(x=>`<div class="module"><span class="module-icon">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div></div></div>`}
function bindDropzone(){const dz=document.getElementById('dropzone'),fi=document.getElementById('dataFile');if(!dz)return;dz.onclick=()=>fi.click();fi.onchange=e=>e.target.files[0]&&analyzeFile(e.target.files[0]);['dragenter','dragover'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>e.dataTransfer.files[0]&&analyzeFile(e.dataTransfer.files[0]))}
function analyzeFile(file){const st=document.getElementById('fileStatus');st.innerHTML='<div class="progress" style="--c:var(--violet)"><i id="analysisBar" style="width:10%"></i></div><p class="muted">جارٍ قراءة الملف وفحص مبادئ DAMA DMBOK…</p>';const reader=new FileReader();reader.onload=()=>{let text=typeof reader.result==='string'?reader.result:'',ext=file.name.split('.').pop().toLowerCase(),stats=inspectData(text,ext,file.size);let scores=scoreDomains(stats,file.name);assessment={source:file.name,type:'ملف '+ext.toUpperCase(),date:new Date().toLocaleString('ar-SA'),stats,scores,overall:Math.round(scores.reduce((s,x)=>s+x.score,0)/11)};analysisBar.style.width='100%';setTimeout(()=>{st.innerHTML=`<div class="assessment-score"><div class="score-orb" style="--p:${assessment.overall}" data-value="${assessment.overall}%"></div><div><b>اكتمل التقييم</b><p class="muted">${stats.rows.toLocaleString('ar')} صف · ${stats.columns} حقول · ${stats.missing}% قيم مفقودة</p><button class="btn primary" onclick="switchAssessment('report')">عرض التقرير التفصيلي</button></div></div>`;toast('اكتمل تحليل الملف عبر المحاور الأحد عشر','success')},350)};if(/xlsx/i.test(file.name))reader.readAsArrayBuffer(file);else reader.readAsText(file,'utf-8')}
function inspectData(text,ext,size){let rows=0,columns=0,missing=0,duplicates=0,headers=[];try{if(ext==='json'){const j=JSON.parse(text),arr=Array.isArray(j)?j:[j];rows=arr.length;headers=Object.keys(arr[0]||{});columns=headers.length;const vals=arr.flatMap(o=>headers.map(h=>o[h]));missing=Math.round(vals.filter(v=>v===null||v===undefined||v==='').length/Math.max(vals.length,1)*100);duplicates=Math.round((rows-new Set(arr.map(x=>JSON.stringify(x))).size)/Math.max(rows,1)*100)}else if(ext==='csv'||ext==='txt'){const lines=text.split(/\r?\n/).filter(Boolean);const sep=ext==='csv'?(lines[0]?.includes(';')?';':','):'\t';headers=(lines[0]||'').split(sep);columns=headers.length;rows=Math.max(0,lines.length-1);const cells=lines.slice(1).flatMap(l=>l.split(sep));missing=Math.round(cells.filter(x=>!x.trim()).length/Math.max(cells.length,1)*100);duplicates=Math.round((rows-new Set(lines.slice(1)).size)/Math.max(rows,1)*100)}else if(ext==='xml'){rows=(text.match(/<row\b|<item\b|<record\b/gi)||[]).length;headers=[...new Set((text.match(/<([A-Za-z_][\w-]*)[ >]/g)||[]).slice(1,21).map(x=>x.replace(/[<> ]/g,'')))];columns=headers.length}else if(ext==='sql'){rows=(text.match(/INSERT\s+INTO/gi)||[]).length;headers=(text.match(/CREATE\s+TABLE\s+[^\s(]+/gi)||[]);columns=(text.match(/\b(?:VARCHAR|INTEGER|DATE|DECIMAL|BOOLEAN|TEXT)\b/gi)||[]).length}else{rows=Math.max(1,Math.round(size/180));columns=Math.max(5,Math.min(30,Math.round(size/5000)));headers=['فحص أولي لملف ثنائي'];missing=4;duplicates=2}}catch(e){rows=Math.max(1,Math.round(size/150));columns=5;headers=[];missing=10;duplicates=3}return{rows,columns,missing,duplicates,headers,size}}
function scoreDomains(s,name){const sensitive=(s.headers||[]).filter(h=>/id|identity|national|phone|email|salary|iban|هوية|هاتف|راتب|بريد/i.test(h)).length,meaningful=(s.headers||[]).filter(h=>h.length>2&&!/^col|field\d/i.test(h)).length;return domains.map((d,i)=>{let score=55+((s.columns*3+i*7)%25);if(d.id==='quality')score=Math.max(35,100-s.missing-s.duplicates*2);if(d.id==='metadata')score=Math.min(95,45+meaningful*4);if(d.id==='security')score=sensitive?58:78;if(d.id==='master')score=Math.max(45,88-s.duplicates*3);if(d.id==='modeling')score=Math.min(92,55+s.columns*2);score=Math.round(Math.min(96,score));let evidence=d.id==='quality'?`نقص ${s.missing}% وتكرار ${s.duplicates}%`:d.id==='metadata'?`${meaningful} حقول بأسماء وصفية`:d.id==='security'?`${sensitive} حقول محتملة الحساسية`:`تم فحص ${s.rows} صف و${s.columns} حقول`;return{d:d.id,score,evidence,gap:Math.max(0,d.target-score)}})}
function databaseAssessment(){return `<div class="grid cols2"><div class="card"><div class="card-title"><div><h3>تعريف موصل قاعدة بيانات</h3><p>إعداد آمن دون تخزين كلمة المرور</p></div></div><div class="form-grid"><div class="field"><label>نوع القاعدة</label><select id="dbType"><option>PostgreSQL</option><option>MySQL</option><option>SQL Server</option><option>Oracle</option><option>Snowflake</option><option>SAP HANA</option><option>MongoDB</option></select></div><div class="field"><label>اسم الاتصال</label><input id="dbName" placeholder="مستودع المبيعات"></div><div class="field"><label>المضيف</label><input id="dbHost" placeholder="db.company.local"></div><div class="field"><label>المنفذ</label><input id="dbPort" value="5432"></div><div class="field"><label>قاعدة البيانات</label><input id="dbDatabase" placeholder="analytics"></div><div class="field"><label>المستخدم</label><input id="dbUser" placeholder="dama_reader"></div><div class="field full"><label>كلمة المرور</label><input id="dbPassword" type="password" placeholder="لا يتم تخزينها"></div></div><div class="toolbar" style="margin-top:14px"><button class="btn" onclick="testConnection()">اختبار الاتصال</button><button class="btn primary" onclick="saveConnection()">حفظ وتشغيل تقييم تجريبي</button></div><div class="connector-note">للاتصال الحقيقي يجب تمرير الطلب إلى Backend آمن داخل شبكة المؤسسة. النسخة الحالية تختبر صحة الحقول وتولد تقييماً نموذجياً جاهزاً للاستبدال بنتائج موصل API.</div></div><div class="card"><div class="card-title"><div><h3>الاتصالات المحفوظة</h3><p>مصادر جاهزة للتقييم</p></div></div><div style="display:grid;gap:9px">${connections.map((c,i)=>`<div class="connection-card"><div><b>${c.name}</b><small>${c.type} · ${c.host}</small></div><div><span class="chip good">${c.status}</span> <button class="btn" onclick="runDbAssessment(${i})">تقييم</button> <button class="btn danger" onclick="removeConnection(${i})">حذف</button></div></div>`).join('')}</div></div></div>`}
function testConnection(){if(!dbHost.value.trim()||!dbDatabase.value.trim())return toast('أدخل المضيف واسم قاعدة البيانات','error');toast('تم التحقق من إعدادات الاتصال بنجاح','success')}
function saveConnection(){if(!dbName.value.trim()||!dbHost.value.trim()||!dbDatabase.value.trim())return toast('يرجى تعبئة اسم الاتصال والمضيف والقاعدة','error');connections.push({name:dbName.value,type:dbType.value,host:dbHost.value,status:'جاهز للتقييم'});toast('تم حفظ تعريف الاتصال','success');runDbAssessment(connections.length-1)}function removeConnection(i){connections.splice(i,1);switchAssessment('database');toast('تم حذف الاتصال','info')}
function runDbAssessment(i){const c=connections[i],stats={rows:2486000,columns:64,missing:7,duplicates:3,headers:['customer_id','email','phone','created_at','status','amount'],size:0},scores=scoreDomains(stats,c.name);assessment={source:c.name,type:c.type,date:new Date().toLocaleString('ar-SA'),stats,scores,overall:Math.round(scores.reduce((s,x)=>s+x.score,0)/11)};activeAssessmentTab='report';content.innerHTML=assessmentPage();toast('تم إنشاء تقييم قاعدة البيانات التجريبي','success')}
function assessmentReport(){if(!assessment)return `<div class="card empty"><div style="font-size:35px">▥</div><h3>لا يوجد تقرير بعد</h3><p>ارفع ملفاً أو شغّل تقييماً لاتصال قاعدة بيانات أولاً.</p><button class="btn primary" onclick="switchAssessment('file')">ابدأ التقييم</button></div>`;const weakest=[...assessment.scores].sort((a,b)=>a.score-b.score).slice(0,3);return `<div class="report-banner"><div><small>DAMA DMBOK ASSESSMENT REPORT</small><h2 style="margin:5px 0">${assessment.source}</h2><p>${assessment.type} · ${assessment.date}</p></div><div class="toolbar-group"><button class="btn" onclick="window.print()">طباعة</button><button class="btn primary" onclick="exportAssessment()">تصدير التقرير CSV</button></div></div><div class="grid kpis" style="margin-top:15px">${kpi('التقييم العام',assessment.overall+'%','عبر 11 محوراً','#6657e8','◈',assessment.overall)}${kpi('السجلات',assessment.stats.rows.toLocaleString('ar'),'تم فحص البنية','#3c87ed','▦')}${kpi('القيم المفقودة',assessment.stats.missing+'%','مؤشر الاكتمال','#ff6b62','!')}${kpi('السجلات المكررة',assessment.stats.duplicates+'%','مؤشر التفرّد','#f4ad32','♢')}</div><div class="grid cols2"><div class="card"><div class="card-title"><div><h3>نتائج المحاور الأحد عشر</h3><p>الدليل المكتشف والفجوة إلى المستهدف — افتح التحليل التفصيلي لكل محور</p></div></div>${assessment.scores.map(x=>{const d=domains.find(z=>z.id===x.d);return `<div class="assessment-domain"><b>${d.icon} ${d.short}</b><div><div class="progress" style="--c:${d.c};margin:0"><i style="width:${x.score}%"></i></div><div class="domain-evidence">${x.evidence}</div></div><strong>${x.score}%</strong><span class="chip ${x.score>=80?'good':x.score>=65?'warn':'bad'}">فجوة ${x.gap}%</span><button class="btn" onclick="showDomainAssessment('${d.id}')">عرض التحليل</button></div>`}).join('')}</div><div><div class="card" style="margin-bottom:14px"><div class="card-title"><div><h3>أولويات التحسين</h3><p>أكبر ثلاث فجوات</p></div></div>${weakest.map((x,i)=>{const d=domains.find(z=>z.id===x.d);return `<div class="risk-callout" style="margin-bottom:8px"><b>${i+1}. ${d.name}</b><div>النتيجة ${x.score}% — ${assessmentRecommendation(d.id,assessment.stats)}</div><button class="btn" style="margin-top:7px" onclick="showDomainAssessment('${d.id}')">التفاصيل والأمثلة</button></div>`}).join('')}</div><div class="card"><div class="card-title"><div><h3>قرار التقييم</h3><p>خلاصة الجاهزية</p></div></div><div class="assessment-score"><div class="score-orb" style="--p:${assessment.overall}" data-value="${assessment.overall}%"></div><div><b>${assessment.overall>=80?'جاهزية جيدة مع فجوات محددة':assessment.overall>=65?'تطبيق جزئي يحتاج خطة تحسين':'فجوات جوهرية تحتاج برنامجاً شاملاً'}</b><p class="muted">يوصى بإنشاء مبادرات للمحاور الأقل من 80% وإرفاق أدلة تنفيذ.</p><button class="btn primary" onclick="createIssuesFromAssessment()">تحويل الفجوات إلى مشكلات</button></div></div></div></div></div>`}

function showDomainAssessment(id){const d=domains.find(x=>x.id===id),x=assessment.scores.find(x=>x.d===id),g=deepGuidance[id],s=assessment.stats,lift=Math.min(x.gap,Math.max(5,Math.round((100-x.score)*.55)));openModal('التحليل التفصيلي - '+d.name,`<div class="deep-head"><div><h3>${d.icon} ${d.name}</h3><div class="muted">تحليل مصدر: ${assessment.source} · الدليل المكتشف: ${x.evidence}</div></div><div class="deep-score">${x.score}%</div></div><div class="deep-grid"><div class="deep-section"><h4>لماذا ظهرت الفجوة؟</h4><div class="deep-list">${g.reasons.map((v,i)=>`<div class="deep-item"><i>${i+1}</i><span>${v}</span></div>`).join('')}</div><div class="risk-callout" style="margin-top:10px">مؤشرات المصدر: ${s.missing}% قيم مفقودة، ${s.duplicates}% تكرار، ${s.columns} حقلاً، و${s.rows.toLocaleString('ar')} صفاً.</div></div><div class="deep-section"><h4>الحل المقترح بالتفصيل</h4><div class="deep-list">${g.solutions.map((v,i)=>`<div class="deep-item"><i>✓</i><span><b>الإجراء ${i+1}:</b> ${v}</span></div>`).join('')}</div></div><div class="deep-section"><h4>أمثلة فعلية يجب تنفيذها</h4>${g.examples.map(v=>`<div class="example-box">${v}</div>`).join('')}</div><div class="deep-section"><h4>ما الدليل المطلوب لرفع التقييم؟</h4><div class="deep-list">${g.evidence.map((v,i)=>`<div class="deep-item"><i>＋</i><span>${v}</span></div>`).join('')}</div><div class="lift-box"><div class="lift"><b>+${lift}%</b><small>تحسن متوقع</small></div><div class="lift"><b>${g.time}</b><small>مدة مقترحة</small></div><div class="lift"><b>${x.gap}%</b><small>الفجوة الحالية</small></div></div></div></div><div class="connector-note"><b>المسؤول المقترح:</b> ${g.owner}. يجب التحقق من التنفيذ وإرفاق الأدلة قبل اعتماد الدرجة الجديدة.</div><div class="toolbar" style="margin:14px 0 0"><button class="btn" onclick="closeModal()">إغلاق</button><button class="btn primary" onclick="createDetailedAction('${id}',${lift})">إنشاء خطة معالجة</button></div>`)}
function createDetailedAction(id,lift){const d=domains.find(x=>x.id===id),g=deepGuidance[id],code='DA-'+id;if(!issues.some(x=>x.id===code)){issues.unshift({id:code,d:id,title:'خطة معالجة تفصيلية لفجوة '+d.name,sev:'مرتفع',status:'مفتوحة',impact:'انخفاض نتيجة تقييم المصدر في محور '+d.name,cause:g.reasons.join('؛ '),rec:g.solutions.join(' ثم '),gain:lift});d.issues++}initiatives.push({d:id,name:'رفع اكتمال '+d.name,owner:g.owner,date:'',result:'تنفيذ الحلول وإرفاق: '+g.evidence.join('، ')});closeModal();toast('تم إنشاء مشكلة ومبادرة تحسين من التحليل التفصيلي','success');go(id);setTimeout(()=>switchDomainTab(id,'problems'),120)}
function assessmentRecommendation(id,s){const r={governance:'تحديد مالك وسياسات ومسؤوليات موثقة للمصدر.',architecture:'توثيق موقع المصدر وتدفقاته وعلاقاته بالأنظمة.',modeling:'اعتماد نموذج منطقي وتعريف الأنواع والمفاتيح.',storage:'توثيق النسخ الاحتياطي والاحتفاظ ومؤشرات الأداء.',security:'تصنيف الحقول الحساسة وتطبيق التشفير والإخفاء.',integration:'تعريف مفاتيح التكامل وقواعد التحقق والمزامنة.',content:'إضافة سياسة احتفاظ وتصنيف وفهرسة للمحتوى.',master:'تطبيق قواعد المطابقة والدمج ومنع التكرار.',warehouse:'تعريف مؤشرات موثوقة وحداثة البيانات التحليلية.',metadata:'استكمال قاموس الحقول والمالك والنسب والتعريف.',quality:`معالجة ${s.missing}% قيم مفقودة و${s.duplicates}% تكرار.`};return r[id]}
function createIssuesFromAssessment(){assessment.scores.filter(x=>x.score<80).forEach(x=>{if(!issues.some(i=>i.id==='AS-'+x.d)){const d=domains.find(z=>z.id===x.d);issues.unshift({id:'AS-'+x.d,d:x.d,title:'فجوة مكتشفة آلياً في '+d.name,sev:x.score<60?'حرج':'مرتفع',status:'مفتوحة',impact:'انخفاض تطبيق مبادئ DAMA DMBOK على مصدر البيانات',cause:x.evidence,rec:assessmentRecommendation(x.d,assessment.stats),gain:Math.min(15,x.gap)});d.issues++}});toast('تم تحويل نتائج التقييم إلى خطة مشكلات قابلة للمتابعة','success');go('issues')}
function exportAssessment(){const rows=[['المحور','النتيجة','الفجوة','الدليل','التوصية'],...assessment.scores.map(x=>{const d=domains.find(z=>z.id===x.d);return[d.name,x.score+'%',x.gap+'%',x.evidence,assessmentRecommendation(x.d,assessment.stats)]})];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='dama-assessment-report.csv';a.click();URL.revokeObjectURL(a.href);toast('تم تصدير تقرير التقييم','success')}

function classificationTable(rows,editable=true){if(!rows.length)return '<div class="empty">لا توجد تصنيفات مطابقة.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>الأصل والحقل</th><th>مستوى السرية</th><th>نوع البيانات</th><th>المالك</th><th>ضابط الوصول</th><th>الإخفاء</th><th>التشفير</th><th>الاحتفاظ</th><th>الأنظمة</th><th>المراجعة</th>${editable?'<th>الإجراء</th>':''}</tr></thead><tbody>${rows.map(x=>`<tr><td><div class="issue-title">${x.asset}</div><div class="issue-code">${x.id} · ${x.field}</div></td><td>${classBadge(x.level)}</td><td>${x.type}</td><td>${x.owner}</td><td>${x.access}</td><td>${x.masking}</td><td>${x.encryption}</td><td>${x.retention}</td><td>${x.systems}</td><td>${x.review}</td>${editable?`<td><button class="btn" onclick="editClassification('${x.id}')">تعديل</button> <button class="btn danger" onclick="deleteClassification('${x.id}')">حذف</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function metadataClassificationContent(){return `<div class="card"><div class="toolbar"><div><h3 style="margin:0">تصنيف سرية الأصول ضمن الكتالوج</h3><span class="muted">عرض مترابط مع سجل أمن البيانات المركزي</span></div><button class="btn primary" onclick="switchDomainTab('security','classification')">فتح سجل التصنيف المركزي</button></div><div>${classifications.map(x=>`<div class="metadata-class"><div><b>${x.asset} · ${x.field}</b><div class="muted">${x.type} · المالك: ${x.owner} · الأنظمة: ${x.systems}</div></div>${classBadge(x.level)}</div>`).join('')}</div></div>`}
function openClassificationModal(id=''){const x=id?classifications.find(c=>c.id===id):null;openModal(id?'تعديل تصنيف البيانات':'إضافة تصنيف بيانات',`<div class="form-grid"><div class="field"><label>اسم الأصل</label><input id="cAsset" value="${x?.asset||''}" placeholder="مثال: قاعدة بيانات العملاء"></div><div class="field"><label>اسم الحقل أو المحتوى</label><input id="cField" value="${x?.field||''}" placeholder="مثال: national_id"></div><div class="field"><label>مستوى السرية</label><select id="cLevel">${Object.keys(classMeta).map(l=>`<option ${x?.level===l?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>نوع البيانات</label><input id="cType" value="${x?.type||''}" placeholder="شخصية، مالية، صحية، تشغيلية"></div><div class="field"><label>مالك البيانات</label><input id="cOwner" value="${x?.owner||''}"></div><div class="field"><label>ضابط الوصول</label><input id="cAccess" value="${x?.access||''}" placeholder="الأدوار المخولة"></div><div class="field"><label>الإخفاء</label><select id="cMasking"><option ${x?.masking==='إلزامي'?'selected':''}>إلزامي</option><option ${x?.masking==='في التقارير العامة'?'selected':''}>في التقارير العامة</option><option ${x?.masking==='غير مطلوب'?'selected':''}>غير مطلوب</option><option ${x?.masking==='إخفاء كامل'?'selected':''}>إخفاء كامل</option></select></div><div class="field"><label>التشفير</label><input id="cEncryption" value="${x?.encryption||''}" placeholder="AES-256 / TLS 1.3"></div><div class="field"><label>مدة الاحتفاظ</label><input id="cRetention" value="${x?.retention||''}" placeholder="مثال: 10 سنوات"></div><div class="field"><label>الأنظمة المستخدمة</label><input id="cSystems" value="${x?.systems||''}"></div><div class="field"><label>تاريخ المراجعة</label><input id="cReview" type="date" value="${x?.review||''}"></div></div><button class="btn primary" style="margin-top:15px" onclick="saveClassification('${id}')">حفظ التصنيف</button>`)}
function saveClassification(id){const v={asset:cAsset.value.trim(),field:cField.value.trim(),level:cLevel.value,type:cType.value.trim(),owner:cOwner.value.trim(),access:cAccess.value.trim(),masking:cMasking.value,encryption:cEncryption.value.trim(),retention:cRetention.value.trim(),systems:cSystems.value.trim(),review:cReview.value};if(Object.values(v).some(x=>!x))return toast('يرجى تعبئة جميع حقول التصنيف','error');if(id){Object.assign(classifications.find(x=>x.id===id),v)}else{v.id='CLS-'+String(classifications.length+1).padStart(3,'0');classifications.push(v)}closeModal();toast('تم حفظ تصنيف السرية وضوابطه','success');switchDomainTab('security','classification')}
function editClassification(id){openClassificationModal(id)}function deleteClassification(id){classifications=classifications.filter(x=>x.id!==id);toast('تم حذف التصنيف','info');switchDomainTab('security','classification')}
function renderClassificationTable(level){document.getElementById('classificationTable').innerHTML=classificationTable(classifications.filter(x=>level==='all'||x.level===level),true)}
function filterClassifications(){const l=classFilter.value,q=classSearch.value.trim();document.getElementById('classificationTable').innerHTML=classificationTable(classifications.filter(x=>(l==='all'||x.level===l)&&(!q||x.asset.includes(q)||x.field.includes(q)||x.owner.includes(q))),true)}
function detectSensitiveFields(){if(!assessment||!assessment.stats.headers?.length)return toast('شغّل تقييماً لملف أو قاعدة بيانات أولاً','error');const patterns=[{r:/national|identity|id_number|هوية/i,level:'حساس',type:'هوية شخصية',masking:'إلزامي'},{r:/email|phone|mobile|بريد|هاتف/i,level:'حساس',type:'بيانات اتصال شخصية',masking:'في التقارير العامة'},{r:/salary|amount|iban|account|راتب|مبلغ|حساب/i,level:'سري',type:'بيانات مالية',masking:'إلزامي'},{r:/password|secret|token|key/i,level:'سري للغاية',type:'سر تقني',masking:'إخفاء كامل'},{r:/health|medical|diagnosis|صحة|تشخيص/i,level:'حساس',type:'بيانات صحية',masking:'إلزامي'}];let added=0;assessment.stats.headers.forEach(h=>{const p=patterns.find(x=>x.r.test(String(h)));if(p&&!classifications.some(x=>x.asset===assessment.source&&x.field===String(h))){classifications.push({id:'AUTO-'+String(Date.now()).slice(-5)+'-'+added,asset:assessment.source,field:String(h),level:p.level,type:p.type,owner:'بانتظار تعيين المالك',access:'أقل صلاحية - يحتاج اعتماد',masking:p.masking,encryption:p.level==='سري للغاية'?'Secret Vault':'AES-256 / TLS 1.3',retention:'بانتظار سياسة الاحتفاظ',systems:assessment.type,review:new Date(Date.now()+90*86400000).toISOString().slice(0,10)});added++}});toast(added?`تم إنشاء ${added} اقتراحات تصنيف من نتائج التقييم`:'لم تُكتشف حقول جديدة محتملة الحساسية',added?'success':'info');switchDomainTab('security','classification')}
function exportClassifications(){const rows=[['الرمز','الأصل','الحقل','السرية','النوع','المالك','الوصول','الإخفاء','التشفير','الاحتفاظ','الأنظمة','المراجعة'],...classifications.map(x=>[x.id,x.asset,x.field,x.level,x.type,x.owner,x.access,x.masking,x.encryption,x.retention,x.systems,x.review])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='data-classification-register.csv';a.click();URL.revokeObjectURL(a.href);toast('تم تصدير سجل تصنيف البيانات','success')}
let governanceDocs=[];let pendingGovFile=null;

function approvalBadge(status){const cls=status==='معتمد'?'approval-approved':status==='مرفوض'?'approval-rejected':'approval-review';return `<span class="chip ${cls}">${status}</span>`}
function governanceDocumentLibrary(){const approved=governanceDocs.filter(x=>x.status==='معتمد').length;return `<div class="grid kpis">${kpi('إجمالي الوثائق',governanceDocs.length,'DOCX · PDF · XLSX','#6657e8','▧')}${kpi('الوثائق المعتمدة',approved,'صالحة للاستخدام','#16b89a','✓',governanceDocs.length?approved/governanceDocs.length*100:0)}${kpi('قيد المراجعة',governanceDocs.filter(x=>x.status==='قيد المراجعة').length,'بانتظار الاعتماد','#f4ad32','↻')}${kpi('المرفوضة',governanceDocs.filter(x=>x.status==='مرفوض').length,'تحتاج تحديثاً','#ff6b62','!')}</div><div class="card"><div class="toolbar"><div><h3 style="margin:0">مكتبة وثائق حوكمة البيانات</h3><span class="muted">حفظ الوثائق وإدارة الاعتماد والعرض والتنزيل</span></div><div class="toolbar-group"><select class="select" id="docStatusFilter" onchange="filterGovernanceDocs()"><option value="all">كل حالات الاعتماد</option><option>معتمد</option><option>قيد المراجعة</option><option>مرفوض</option></select><input class="input" id="docSearch" placeholder="بحث باسم الوثيقة" oninput="filterGovernanceDocs()"><button class="btn primary" onclick="openGovernanceDocUpload()">⇧ رفع وثيقة</button></div></div><div id="govDocList">${governanceDocCards(governanceDocs)}</div></div><div class="connector-note"><b>ملاحظة الحفظ:</b> تعمل الملفات خلال جلسة المتصفح الحالية. للحفظ المؤسسي الدائم يجب ربط المكتبة بخدمة ملفات آمنة مثل S3 أو MinIO وقاعدة بيانات للاعتمادات.</div>`}
function governanceDocCards(rows){if(!rows.length)return `<div class="empty"><div style="font-size:34px">▧</div><h3>لا توجد وثائق مرفوعة</h3><p>ارفع أول وثيقة حوكمة بصيغة DOCX أو PDF أو XLSX.</p><button class="btn primary" onclick="openGovernanceDocUpload()">رفع وثيقة</button></div>`;return `<div class="grid doc-cards">${rows.map(x=>{const idx=governanceDocs.indexOf(x),type=x.ext.toUpperCase();return `<article class="doc-card"><div class="toolbar" style="margin:0"><span class="file-type type-${x.ext}">${type}</span>${approvalBadge(x.status)}</div><h4>${x.title}</h4><p>${x.file.name}</p><div class="doc-meta"><span>الإصدار: ${x.version}</span><span>الحجم: ${formatFileSize(x.file.size)}</span><span>المالك: ${x.owner}</span><span>السريان: ${x.effective||'غير محدد'}</span></div><div class="toolbar" style="margin:0"><div class="toolbar-group"><button class="btn" onclick="viewGovernanceDoc(${idx})">عرض</button><button class="btn" onclick="downloadGovernanceDoc(${idx})">تنزيل</button></div><div class="toolbar-group"><button class="btn" onclick="changeDocApproval(${idx})">الاعتماد</button><button class="btn danger" onclick="deleteGovernanceDoc(${idx})">حذف</button></div></div></article>`}).join('')}</div>`}
function formatFileSize(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
function openGovernanceDocUpload(){pendingGovFile=null;openModal('رفع وثيقة حوكمة',`<div class="form-grid"><div class="field full"><label>اسم الوثيقة</label><input id="gdTitle" placeholder="مثال: سياسة حوكمة البيانات"></div><div class="field"><label>حالة الاعتماد عند الرفع</label><select id="gdStatus"><option>قيد المراجعة</option><option>معتمد</option><option>مرفوض</option></select></div><div class="field"><label>الإصدار</label><input id="gdVersion" value="v1.0"></div><div class="field"><label>مالك الوثيقة</label><input id="gdOwner" placeholder="مكتب إدارة البيانات"></div><div class="field"><label>تاريخ السريان</label><input id="gdEffective" type="date"></div><div class="field full"><label>ملاحظات الاعتماد</label><textarea id="gdNotes" rows="3" placeholder="القرار أو الجهة المعتمدة أو سبب الرفض"></textarea></div><div class="field full"><label>الملف</label><div class="doc-upload" id="govDrop"><div class="doc-icon">⇧</div><b>اختر ملف DOCX أو PDF أو XLSX</b><small>الحد المقترح 25 MB</small></div><input id="govFileInput" type="file" hidden accept=".docx,.pdf,.xlsx"><div id="govFileStatus"></div></div></div><button class="btn primary" style="margin-top:14px" onclick="saveGovernanceDoc()">حفظ الوثيقة</button>`);setTimeout(bindGovernanceUpload,0)}
function bindGovernanceUpload(){const dz=document.getElementById('govDrop'),fi=document.getElementById('govFileInput');if(!dz)return;dz.onclick=()=>fi.click();fi.onchange=e=>selectGovernanceFile(e.target.files[0]);['dragenter','dragover'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('drag')}));dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');selectGovernanceFile(e.dataTransfer.files[0])})}
function selectGovernanceFile(file){if(!file)return;const ext=file.name.split('.').pop().toLowerCase();if(!['docx','pdf','xlsx'].includes(ext)){pendingGovFile=null;return toast('الصيغ المسموحة DOCX وPDF وXLSX فقط','error')}if(file.size>25*1024*1024){pendingGovFile=null;return toast('حجم الملف يتجاوز 25 MB','error')}pendingGovFile=file;document.getElementById('govFileStatus').innerHTML=`<div class="file-selected">✓ ${file.name} · ${formatFileSize(file.size)}</div>`;if(!gdTitle.value)gdTitle.value=file.name.replace(/\\.[^.]+$/,'')}
function saveGovernanceDoc(){if(!pendingGovFile)return toast('اختر ملفاً للرفع','error');if(!gdTitle.value.trim()||!gdOwner.value.trim())return toast('أدخل اسم الوثيقة ومالكها','error');const ext=pendingGovFile.name.split('.').pop().toLowerCase(),url=URL.createObjectURL(pendingGovFile);governanceDocs.unshift({title:gdTitle.value.trim(),status:gdStatus.value,version:gdVersion.value.trim()||'v1.0',owner:gdOwner.value.trim(),effective:gdEffective.value,notes:gdNotes.value.trim(),file:pendingGovFile,ext,url,uploaded:new Date().toLocaleString('ar-SA')});pendingGovFile=null;closeModal();toast('تم رفع الوثيقة وتسجيل حالة اعتمادها','success');switchDomainTab('governance','documents')}

function changeDocApproval(i){const x=governanceDocs[i];openModal('تحديث حالة الاعتماد',`<div class="field"><label>حالة الوثيقة</label><select id="approvalStatus"><option ${x.status==='قيد المراجعة'?'selected':''}>قيد المراجعة</option><option ${x.status==='معتمد'?'selected':''}>معتمد</option><option ${x.status==='مرفوض'?'selected':''}>مرفوض</option></select></div><div class="field" style="margin-top:10px"><label>ملاحظات القرار</label><textarea id="approvalNotes" rows="4">${x.notes||''}</textarea></div><button class="btn primary" style="margin-top:12px" onclick="saveDocApproval(${i})">حفظ القرار</button>`)}

function renderLinkedManager(){const c=linkedContext,files=linkedFiles[c.key]||[];openModal('الملفات المرتبطة',`<div class="relation-banner"><b>${relationLabel(c.kind)} ← ${c.name}</b><small>كل ملف مرفوع أدناه مرتبط مباشرةً بهذا العنصر داخل محور ${domains.find(d=>d.id===c.id).name}.</small></div><div class="form-grid"><div class="field"><label>عنوان الملف</label><input id="lfTitle" placeholder="مثال: محضر اعتماد السياسة"></div><div class="field"><label>حالة الاعتماد عند الرفع</label><select id="lfStatus"><option>قيد المراجعة</option><option>معتمد</option><option>مرفوض</option></select></div><div class="field"><label>الإصدار</label><input id="lfVersion" value="v1.0"></div><div class="field"><label>تاريخ السريان</label><input id="lfEffective" type="date"></div><div class="field full"><label>ملاحظات الاعتماد</label><textarea id="lfNotes" rows="2" placeholder="الجهة المعتمدة أو سبب المراجعة/الرفض"></textarea></div><div class="field full"><div class="doc-upload" id="linkedDrop"><div class="doc-icon">⇧</div><b>اختر DOCX أو PDF أو XLSX</b><small>سيتم ربط الملف بـ ${c.name}</small></div><input id="linkedFileInput" type="file" hidden accept=".docx,.pdf,.xlsx"><div id="linkedFileStatus"></div></div></div><button class="btn primary" style="margin:10px 0 16px" onclick="saveLinkedFile()">رفع وربط الملف</button><div class="card-title"><div><h3>الملفات المرتبطة (${files.length})</h3><p>يمكن العرض والتنزيل وتغيير حالة الاعتماد</p></div></div><div>${linkedFileRows(files)}</div>`);setTimeout(bindLinkedUpload,0)}
function linkedFileRows(files){if(!files.length)return '<div class="empty" style="padding:22px">لم تُرفع ملفات لهذا العنصر بعد.</div>';return files.map((x,i)=>`<div class="linked-file"><span class="file-type type-${x.ext}">${x.ext.toUpperCase()}</span><div><h4>${x.title}</h4><p>${x.file.name} · ${formatFileSize(x.file.size)} · ${x.version}</p><div>${approvalBadge(x.status)}</div><div class="approval-history">آخر تحديث للاعتماد: ${x.approvalUpdated}</div></div><div class="linked-actions"><button class="btn" onclick="viewLinkedFile(${i})">عرض</button><button class="btn" onclick="downloadLinkedFile(${i})">تنزيل</button><button class="btn" onclick="changeLinkedApproval(${i})">تغيير الاعتماد</button><button class="btn danger" onclick="deleteLinkedFile(${i})">حذف</button></div></div>`).join('')}
function bindLinkedUpload(){const dz=document.getElementById('linkedDrop'),fi=document.getElementById('linkedFileInput');pendingLinkedFile=null;if(!dz)return;dz.onclick=()=>fi.click();fi.onchange=e=>selectLinkedFile(e.target.files[0]);['dragenter','dragover'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('drag')}));dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');selectLinkedFile(e.dataTransfer.files[0])})}
function selectLinkedFile(file){if(!file)return;const ext=file.name.split('.').pop().toLowerCase();if(!['docx','pdf','xlsx'].includes(ext))return toast('الصيغ المسموحة DOCX وPDF وXLSX فقط','error');if(file.size>25*1024*1024)return toast('حجم الملف يتجاوز 25 MB','error');pendingLinkedFile=file;linkedFileStatus.innerHTML=`<div class="file-selected">✓ ${file.name} · ${formatFileSize(file.size)}</div>`;if(!lfTitle.value)lfTitle.value=file.name.replace(/\\.[^.]+$/,'')}
function saveLinkedFile(){if(!pendingLinkedFile)return toast('اختر ملفاً للرفع','error');if(!lfTitle.value.trim())return toast('أدخل عنوان الملف','error');const ext=pendingLinkedFile.name.split('.').pop().toLowerCase(),now=new Date().toLocaleString('ar-SA'),entry={title:lfTitle.value.trim(),status:lfStatus.value,version:lfVersion.value.trim()||'v1.0',effective:lfEffective.value,notes:lfNotes.value.trim(),file:pendingLinkedFile,ext,url:URL.createObjectURL(pendingLinkedFile),uploaded:now,approvalUpdated:now,history:[{status:lfStatus.value,date:now,note:lfNotes.value.trim()}]};if(!linkedFiles[linkedContext.key])linkedFiles[linkedContext.key]=[];linkedFiles[linkedContext.key].unshift(entry);pendingLinkedFile=null;toast('تم رفع الملف وربطه بالعنصر وتسجيل الاعتماد','success');renderLinkedManager()}
function viewLinkedFile(i){const x=(linkedFiles[linkedContext.key]||[])[i];if(!x)return;if(x.ext==='pdf'){openModal(x.title,`<div class="relation-banner"><b>مرتبط بـ: ${linkedContext.name}</b><small>${relationLabel(linkedContext.kind)} · ${approvalBadge(x.status)}</small></div><iframe class="pdf-frame" src="${x.url}" title="${x.title}"></iframe><button class="btn primary" style="margin-top:10px" onclick="downloadLinkedFile(${i})">تنزيل الملف</button>`)}else{openModal(x.title,`<div class="relation-banner"><b>مرتبط بـ: ${linkedContext.name}</b><small>${relationLabel(linkedContext.kind)}</small></div><div class="assessment-score"><span class="file-type type-${x.ext}" style="width:62px;height:62px">${x.ext.toUpperCase()}</span><div><b>${x.file.name}</b><p class="muted">${formatFileSize(x.file.size)} · ${x.version}</p>${approvalBadge(x.status)}</div></div><div class="card" style="margin-top:12px"><div class="stat-list"><div class="stat-line"><span>تاريخ السريان</span><b>${x.effective||'غير محدد'}</b></div><div class="stat-line"><span>ملاحظات الاعتماد</span><b>${x.notes||'لا توجد'}</b></div><div class="stat-line"><span>تاريخ الرفع</span><b>${x.uploaded}</b></div></div></div><div class="connector-note">لعرض محتوى DOCX أو XLSX استخدم التنزيل وافتح الملف في Word أو Excel.</div><button class="btn primary" style="margin-top:10px" onclick="downloadLinkedFile(${i})">تنزيل وفتح الملف</button>`)}}

async function generateEnhancedFile(){const ids=[...document.querySelectorAll('input[name=enhanceDomain]:checked')].map(x=>x.value);if(!ids.length)return toast('اختر محوراً واحداً على الأقل','error');if(!document.getElementById('enhancementApproval').checked)return toast('يجب الموافقة قبل تعديل النسخة','error');const version=(document.getElementById('enhancedVersion').value.trim()||'V2').replace(/[^\w\u0600-\u06FF-]/g,'_'),ext=activeSourceFile.name.split('.').pop().toLowerCase();try{const originalOverall=assessment.overall,blob=ext==='xlsx'?await enhanceXlsx(activeSourceBuffer,ids):await enhanceDocx(activeSourceBuffer,ids),base=activeSourceFile.name.replace(/\.[^.]+$/,''),name=`${base}_محسن_${version}.${ext}`;downloadBlob(blob,name);const selected=new Set(ids),scores=assessment.scores.map(x=>selected.has(x.d)?{...x,score:Math.min(domains.find(d=>d.id===x.d).target,x.score+20),gap:Math.max(0,domains.find(d=>d.id===x.d).target-Math.min(domains.find(d=>d.id===x.d).target,x.score+20)),evidence:x.evidence+' + أضيفت مادة تحسين للملف'}:x),overall=Math.round(scores.reduce((s,x)=>s+x.score,0)/11);enhancementResult={name,original:activeSourceFile.name,ids,originalOverall,overall,date:new Date().toLocaleString('ar-SA'),version};enhancementHistory.unshift(enhancementResult);assessment={...assessment,source:name,date:enhancementResult.date,scores,overall};closeModal();activeAssessmentTab='report';content.innerHTML=assessmentPage();toast('تم إنشاء النسخة المحسّنة وتنزيلها وإعادة تقييمها','success')}catch(e){console.error(e);toast('تعذر إنشاء النسخة: '+e.message,'error')}}
